<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#F7F5F0" />
  <title>心情日历 · 今日</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=IBM+Plex+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #F7F2E8;
      --paper-2: #FFFDF8;
      --ink: #2B2926;
      --muted: #8F8981;
      --line: #DED8CD;
      --accent: #C5CCD4;
      --peach: #F3C8B9;
      --sage: #C7D7C6;
      --tape: #E7D0C6;
      --pola: #FFFEFA;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "IBM Plex Sans SC", "PingFang SC", "Noto Sans SC", sans-serif;
      background-color: var(--paper);
      background-image:
        radial-gradient(rgba(80,68,55,.075) .7px, transparent .8px),
        linear-gradient(rgba(255,255,255,.18), rgba(255,255,255,.18));
      background-size: 8px 8px, auto;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden;
    }
    ::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }
    button, input, textarea { font: inherit; color: inherit; }
    button { border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:focus-visible, textarea:focus-visible, input:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 65%, #8895a0);
      outline-offset: 3px;
    }

    .shell {
      width: min(430px, 100%);
      margin: 0 auto;
      padding: calc(16px + var(--safe-t)) 16px calc(24px + var(--safe-b));
    }

    /* Header: date card + handwritten note + weather strip */
    .meta {
      position: relative;
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      grid-template-rows: 54px 112px;
      gap: 6px 12px;
      margin-bottom: 20px;
      min-height: 172px;
    }
    .date-block {
      grid-column: 1;
      grid-row: 1 / 3;
      position: relative;
      align-self: stretch;
      padding: 24px 16px 18px;
      background: rgba(255,253,248,.96);
      clip-path: polygon(3% 2%, 96% 0, 100% 5%, 98% 95%, 92% 100%, 4% 97%, 0 91%, 2% 8%);
      filter: drop-shadow(0 7px 8px rgba(67,54,42,.09));
      overflow: visible;
    }
    .date-block::before {
      content: "";
      position: absolute;
      width: 62px;
      height: 18px;
      top: -4px;
      left: 26px;
      border-radius: 2px;
      background:
        linear-gradient(90deg, rgba(206,139,137,.18) 50%, transparent 50%) 0 0/10px 10px,
        linear-gradient(rgba(206,139,137,.18) 50%, transparent 50%) 0 0/10px 10px,
        rgba(241,184,180,.55);
      transform: rotate(6deg);
      box-shadow: 0 1px 1px rgba(0,0,0,.03);
    }
    .date-block input[type="date"] {
      position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer;
    }
    .day {
      font-family: "Noto Serif SC", "Songti SC", serif;
      font-size: 3.5rem;
      line-height: .95;
      font-weight: 600;
      letter-spacing: -.06em;
      color: #2A2926;
    }
    .ym {
      margin-top: 8px;
      font-size: .92rem;
      color: #6E6A65;
      font-weight: 500;
      letter-spacing: .02em;
    }
    .dow {
      margin-top: 4px;
      font-size: .78rem;
      color: #766F68;
      font-weight: 500;
    }
    .date-leaf {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 28px;
      height: 58px;
      transform: rotate(16deg);
    }
    .date-leaf::before {
      content: "";
      position: absolute;
      left: 13px;
      top: 7px;
      width: 1.5px;
      height: 48px;
      background: #68896D;
      transform: rotate(2deg);
      transform-origin: bottom;
    }
    .date-leaf i {
      position: absolute;
      width: 12px;
      height: 7px;
      border-radius: 100% 0 100% 0;
      background: #769779;
      transform: rotate(-30deg);
    }
    .date-leaf i:nth-child(1){ left: 4px; top: 16px; }
    .date-leaf i:nth-child(2){ right: 1px; top: 26px; transform: rotate(150deg); }
    .date-leaf i:nth-child(3){ left: 5px; top: 37px; }

    .header-note {
      grid-column: 2;
      grid-row: 1;
      align-self: start;
      justify-self: end;
      max-width: 185px;
      padding-right: 14px;
      color: #A88979;
      text-align: right;
      font-family: "STKaiti", "KaiTi", "Noto Serif SC", serif;
      font-size: .86rem;
      line-height: 1.45;
      transform: rotate(-3deg);
      letter-spacing: .04em;
    }
    .flower-sprig {
      position: absolute;
      right: -4px;
      top: 22px;
      width: 30px;
      height: 70px;
      pointer-events: none;
      opacity: .85;
    }
    .flower-sprig::before {
      content: "";
      position: absolute;
      left: 14px;
      top: 15px;
      width: 2px;
      height: 52px;
      background: #6F8A5B;
      transform: rotate(10deg);
      border-radius: 999px;
    }
    .flower-sprig::after {
      content: "";
      position: absolute;
      inset: 3px 0 auto 0;
      height: 34px;
      background:
        radial-gradient(circle at 48% 28%, #F1C957 0 2px, #FFF 2.5px 6px, transparent 6.5px),
        radial-gradient(circle at 78% 55%, #F1C957 0 2px, #FFF 2.5px 6px, transparent 6.5px),
        radial-gradient(circle at 22% 72%, #F1C957 0 2px, #FFF 2.5px 6px, transparent 6.5px);
    }

    .weather-paper {
      grid-column: 2;
      grid-row: 2;
      align-self: stretch;
      display: flex;
      align-items: center;
      padding: 12px 8px 10px;
      background: rgba(255,253,248,.95);
      clip-path: polygon(2% 5%, 8% 1%, 96% 2%, 100% 8%, 98% 94%, 91% 99%, 4% 96%, 0 88%);
      filter: drop-shadow(0 7px 8px rgba(67,54,42,.08));
    }
    .wx-mini {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(6, minmax(0,1fr));
      gap: 2px;
    }
    .wx {
      min-width: 0;
      min-height: 74px;
      padding: 6px 1px 3px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: var(--muted);
      opacity: .82;
      transition: background .16s ease, opacity .16s ease, transform .16s ease;
    }
    .wx:active { transform: translateY(1px); }
    .wx-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 11px;
    }
    .wx.is-on { opacity: 1; color: var(--ink); }
    .wx.is-on .wx-icon {
      background: color-mix(in srgb, var(--tone, #E8C547) 18%, #FFF8E9);
      box-shadow: 0 3px 10px color-mix(in srgb, var(--tone, #E8C547) 18%, transparent);
    }
    .wx-img {
      width: 24px; height: 24px; display: block; object-fit: contain; pointer-events: none;
    }
    .wx-label {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: .62rem;
      line-height: 1;
      color: #77716A;
    }
    .wx.is-on .wx-label { color: #A97E27; font-weight: 700; }

    /* Mood paper */
    .mood-wrap {
      position: relative;
      margin-bottom: 18px;
      padding: 40px 10px 14px;
      background: rgba(255,253,248,.96);
      clip-path: polygon(1% 3%, 7% 0, 98% 2%, 100% 8%, 98% 95%, 91% 100%, 4% 97%, 0 90%);
      filter: drop-shadow(0 8px 9px rgba(67,54,42,.07));
    }
    .ask {
      position: absolute;
      left: 14px;
      top: -3px;
      margin: 0;
      padding: 7px 14px 6px;
      background: #F2C9BB;
      clip-path: polygon(3% 11%, 94% 0, 100% 16%, 97% 92%, 8% 100%, 0 82%);
      font-family: "STKaiti", "KaiTi", "Noto Serif SC", serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: .03em;
      transform: rotate(-1.2deg);
      z-index: 2;
    }
    .mood-rail {
      display: grid;
      grid-template-columns: repeat(6, minmax(0,1fr));
      gap: 2px;
    }
    .mood-stamp {
      min-width: 0;
      min-height: 72px;
      padding: 6px 0 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 12px;
      transition: background .15s ease, transform .15s ease;
    }
    .mood-stamp:active { transform: translateY(1px); }
    .mood-face {
      width: 38px; height: 38px;
      display: grid; place-items: center;
      border-radius: 14px;
      transition: background .15s ease, box-shadow .15s ease, transform .15s ease;
    }
    .stamp-img { width: 32px; height: 32px; display: block; object-fit: contain; pointer-events: none; }
    .mood-stamp .lbl {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #5F5A55;
      font-size: .72rem;
      line-height: 1;
      font-weight: 600;
    }
    .mood-stamp.is-on .mood-face {
      background: color-mix(in srgb, var(--tone) 14%, #FFFDF8);
      box-shadow: 0 3px 10px color-mix(in srgb, var(--tone) 17%, transparent);
      transform: scale(1.04);
    }
    .mood-stamp.is-on .lbl { color: var(--ink); }

    /* Diary note paper */
    .page {
      position: relative;
      margin: 0 0 18px;
      padding: 45px 14px 14px 28px;
      background: rgba(255,253,248,.97);
      border-radius: 20px;
      border: 1px solid rgba(190,181,168,.24);
      box-shadow: 0 8px 18px rgba(67,54,42,.055);
    }
    .page::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 18px;
      bottom: 18px;
      width: 12px;
      background:
        radial-gradient(circle, #E7DFD1 0 5px, transparent 5.5px) center top/12px 34px repeat-y;
      opacity: .95;
    }
    .page-label {
      position: absolute;
      left: 26px;
      top: 6px;
      margin: 0;
      padding: 7px 14px 6px;
      background: #F4CDBE;
      clip-path: polygon(2% 14%, 96% 0, 100% 18%, 94% 92%, 9% 100%, 0 79%);
      font-family: "STKaiti", "KaiTi", "Noto Serif SC", serif;
      font-size: 1rem;
      line-height: 1;
      font-weight: 600;
      letter-spacing: .04em;
      transform: rotate(-1deg);
    }
    .note-shell { position: relative; }
    .note {
      width: 100%;
      height: 86px;
      min-height: 86px;
      max-height: 170px;
      margin: 0;
      padding: 16px 42px 20px 42px;
      border: 1px solid #E3DED5;
      border-radius: 18px;
      background: rgba(255,255,255,.38);
      resize: none;
      overflow-y: hidden;
      font-size: 1rem;
      line-height: 1.65;
      caret-color: color-mix(in srgb, var(--accent) 65%, #2A2A2A);
      box-shadow: inset 0 1px 2px rgba(78,68,55,.02);
    }
    .note:focus { outline: 2px solid color-mix(in srgb, var(--accent) 42%, transparent); }
    .note::placeholder { color: #AAA39B; }
    .note-pencil {
      position: absolute;
      left: 15px;
      top: 17px;
      width: 14px;
      height: 14px;
      border: 2px solid #918A82;
      border-radius: 2px;
      transform: rotate(-45deg);
      pointer-events: none;
    }
    .note-pencil::after {
      content: "";
      position: absolute;
      right: -5px;
      top: 3px;
      width: 5px;
      height: 4px;
      background: #918A82;
      border-radius: 0 2px 2px 0;
    }
    .note-count {
      position: absolute;
      right: 15px;
      bottom: 10px;
      color: #AAA39B;
      font-size: .69rem;
      pointer-events: none;
    }
    .note-heart {
      position: absolute;
      top: 16px;
      right: 18px;
      color: #DF8C7E;
      font-family: "STKaiti","KaiTi",serif;
      font-size: 1.45rem;
      transform: rotate(10deg);
    }

    /* Scrapbook photo panel */
    .media {
      position: relative;
      margin: 0;
      padding: 48px 10px 18px;
      background: rgba(255,253,248,.96);
      clip-path: polygon(1% 3%, 9% 0, 97% 2%, 100% 8%, 98% 96%, 89% 100%, 3% 97%, 0 90%);
      filter: drop-shadow(0 8px 9px rgba(67,54,42,.07));
    }
    .media-title {
      position: absolute;
      top: 5px;
      left: 12px;
      margin: 0;
      padding: 7px 14px 6px;
      background: #C8D9C7;
      clip-path: polygon(2% 10%, 95% 0, 100% 18%, 94% 92%, 8% 100%, 0 82%);
      font-family: "STKaiti", "KaiTi", "Noto Serif SC", serif;
      font-size: 1rem;
      line-height: 1;
      font-weight: 600;
      letter-spacing: .05em;
      transform: rotate(-2deg);
    }
    .media-title::before {
      content: "";
      display: inline-block;
      width: 13px;
      height: 10px;
      margin-right: 7px;
      border: 2px solid #2F3730;
      border-radius: 2px;
      vertical-align: -1px;
    }
    .media-title::after {
      content: "";
      position: absolute;
      left: 16px;
      top: 3px;
      width: 5px; height: 5px;
      border: 2px solid #2F3730;
      border-radius: 50%;
      background: transparent;
    }
    .pola-stage {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 3px 12px;
      scrollbar-width: none;
      scroll-snap-type: x proximity;
    }
    .pola-stage::-webkit-scrollbar { display: none; }
    .pola {
      flex: 0 0 136px;
      padding: 8px 8px 28px;
      background: var(--pola);
      border: 1px solid #E9E2D8;
      border-radius: 3px;
      box-shadow: 0 5px 14px rgba(42,42,42,.09);
      position: relative;
      transform: rotate(-1.8deg);
      scroll-snap-align: start;
    }
    .pola:nth-child(even) { transform: rotate(1.5deg); }
    .pola::before {
      content: "";
      position: absolute;
      width: 56px; height: 16px;
      left: 40px; top: -8px;
      background: rgba(237,189,188,.72);
      transform: rotate(2deg);
      z-index: 2;
      border-radius: 1px;
    }
    .pola:nth-child(even)::before { background: rgba(187,205,230,.72); transform: rotate(-2deg); }
    .pola.is-cover { box-shadow: 0 5px 14px rgba(42,42,42,.09), 0 0 0 2px color-mix(in srgb, var(--accent) 58%, transparent); }
    .pola img {
      width: 100%;
      height: 118px;
      display: block;
      object-fit: cover;
      background: var(--line);
    }
    .pola .cap {
      position: absolute;
      left: 8px; right: 8px; bottom: 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #7E7770;
      font-family: "STKaiti","KaiTi",serif;
      font-size: .67rem;
    }
    .photo-empty {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 2px 2px 8px;
    }
    .photo-choice {
      min-height: 112px;
      border: 1.5px dashed #D8D0C5;
      border-radius: 14px;
      background: rgba(255,255,255,.3);
      color: #877F76;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 6px;
      font-size: .76rem;
      font-weight: 600;
    }
    .photo-choice .plus {
      font-family: Arial, sans-serif;
      font-size: 2rem;
      font-weight: 300;
      line-height: 1;
      color: #7A7269;
    }
    .photo-choice.camera .plus {
      width: 31px; height: 23px;
      border: 2px solid #7A7269;
      border-radius: 5px;
      position: relative;
      font-size: 0;
    }
    .photo-choice.camera .plus::before {
      content: "";
      position: absolute;
      width: 8px; height: 8px;
      border: 2px solid #7A7269;
      border-radius: 50%;
      left: 9px; top: 5px;
    }
    .photo-choice.camera .plus::after {
      content: "";
      position: absolute;
      width: 11px; height: 4px;
      border-radius: 3px 3px 0 0;
      background: #7A7269;
      left: 8px; top: -6px;
    }
    .pola-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding: 3px 4px 0;
      align-items: center;
    }
    .ghost {
      min-height: 34px;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(230,225,216,.72);
      color: #756F68;
      font-size: .72rem;
      font-weight: 650;
    }
    .ghost.danger { color: #A45E56; }
    .ghost[disabled] { opacity: .38; }

    .soft-note {
      margin: 12px 0 2px 18px;
      color: #B69A89;
      font-family: "STKaiti","KaiTi","Noto Serif SC",serif;
      font-size: .83rem;
      line-height: 1.45;
      transform: rotate(-4deg);
      width: max-content;
    }

    .foot {
      position: relative;
      margin-top: 10px;
      padding: 17px 4px 12px;
      z-index: 1;
    }
    .foot::before {
      content: "";
      position: absolute;
      inset: 6px -6px 2px;
      background: rgba(255,253,248,.96);
      clip-path: polygon(2% 8%, 8% 0, 96% 3%, 100% 14%, 97% 94%, 88% 100%, 4% 96%, 0 83%);
      filter: drop-shadow(0 6px 8px rgba(67,54,42,.06));
      z-index: -1;
    }
    .seal {
      width: 100%;
      min-height: 58px;
      border-radius: 999px;
      background: linear-gradient(180deg, #292929, #202020);
      color: #F9F6EF;
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: .08em;
      box-shadow: 0 10px 24px rgba(37,33,30,.14);
    }
    .seal::after { content: "✦"; margin-left: 18px; color: #F4D77B; font-size: .9rem; }
    .seal:active { transform: translateY(1px); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + var(--safe-b));
      z-index: 40;
      width: min(340px, calc(100% - 28px));
      transform: translateX(-50%) translateY(10px);
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(42,42,42,.93);
      color: #F7F5F0;
      font-size: .84rem;
      line-height: 1.45;
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .file-hidden {
      position: fixed;
      right: 0; bottom: 0;
      width: 1px; height: 1px;
      opacity: .01;
      overflow: hidden;
    }

    @media (max-width: 360px) {
      .shell { padding-left: 12px; padding-right: 12px; }
      .meta { grid-template-columns: 104px minmax(0,1fr); gap: 6px 8px; }
      .date-block { padding-left: 13px; padding-right: 13px; }
      .day { font-size: 3.2rem; }
      .wx { min-height: 68px; }
      .wx-img { width: 22px; height: 22px; }
      .wx-label { font-size: .58rem; }
      .mood-stamp .lbl { font-size: .66rem; }
      .mood-face { width: 34px; height: 34px; }
      .stamp-img { width: 29px; height: 29px; }
    }


    /* iPhone SE 2/3: 375×667 CSS viewport. Keep the full empty-state page visible at once. */
    @media (max-width: 390px) and (max-height: 700px) {
      .shell {
        padding: calc(6px + var(--safe-t)) 12px calc(8px + var(--safe-b));
      }

      .meta {
        grid-template-columns: 96px minmax(0, 1fr);
        grid-template-rows: 28px 104px;
        gap: 6px 8px;
        min-height: 138px;
        margin-bottom: 10px;
      }
      .date-block {
        grid-column: 1;
        grid-row: 1 / 3;
        padding: 18px 12px 10px;
      }
      .date-block::before {
        width: 50px;
        height: 14px;
        left: 22px;
        top: -3px;
        background-size: 8px 8px, 8px 8px, auto;
      }
      .day { font-size: 2.75rem; }
      .ym { margin-top: 5px; font-size: .72rem; }
      .dow { margin-top: 2px; font-size: .66rem; }
      .date-leaf {
        right: 7px;
        bottom: 7px;
        width: 22px;
        height: 44px;
        transform: rotate(14deg) scale(.8);
        transform-origin: bottom right;
      }
      .header-note {
        display: block;
        grid-column: 2;
        grid-row: 1;
        align-self: end;
        justify-self: end;
        max-width: 154px;
        padding-right: 18px;
        font-size: .72rem;
        line-height: 1.28;
        opacity: .92;
        transform: rotate(-3deg);
      }
      .flower-sprig {
        display: block;
        right: -3px;
        top: 11px;
        width: 24px;
        height: 56px;
        opacity: .86;
      }
      .flower-sprig::before {
        left: 11px;
        top: 12px;
        height: 42px;
      }
      .flower-sprig::after {
        inset: 2px 0 auto 0;
        height: 28px;
        background:
          radial-gradient(circle at 48% 28%, #F1C957 0 1.6px, #FFF 2px 5px, transparent 5.5px),
          radial-gradient(circle at 78% 55%, #F1C957 0 1.6px, #FFF 2px 5px, transparent 5.5px),

const WEEKDAYS = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
const state = { dateKey:"", datePinned:false, weather:"", mood:"", note:"", photos:[], coverId:null, viewingId:null };
const els = {
  dateInput: document.getElementById("dateInput"),
  dow: document.getElementById("dow"),
  dayNum: document.getElementById("dayNum"),
  ym: document.getElementById("ym"),
  moodRail: document.getElementById("moodRail"),
  weatherRow: document.getElementById("weatherRow"),
  note: document.getElementById("note"),
  photosMount: document.getElementById("photosMount"),
  fileInput: document.getElementById("fileInput"),
  cameraInput: document.getElementById("cameraInput"),
  saveBtn: document.getElementById("saveBtn"),
  toast: document.getElementById("toast"),
  noteCount: document.getElementById("noteCount"),
};
function pad(n){return String(n).padStart(2,"0")}
function toKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function todayKey(){
  // Prefer Asia/Shanghai calendar day (Ke's zone); en-CA → YYYY-MM-DD
  try {
    return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
  } catch (e) {
    return toKey(new Date());
  }
}
function parseKey(k){const [y,m,d]=String(k).split("-").map(Number);return new Date(y,m-1,d,12)}
function applyAccent(){
  const m = MOODS.find(x=>x.id===state.mood);
  const w = WEATHER.find(x=>x.id===state.weather);
  document.documentElement.style.setProperty("--accent", (m||w||{color:"#C5CCD4"}).color);
}
function renderMood(){
  els.moodRail.innerHTML = MOODS.map(item=>{
    const on = state.mood===item.id;
    return `<button type="button" class="mood-stamp${on?" is-on":""}" role="option" aria-selected="${on}" data-id="${item.id}" style="--tone:${item.color}">
      <span class="mood-face" aria-hidden="true"><img class="stamp-img" alt="" src="${MOOD_ICONS[item.id]}" /></span>
      <span class="lbl">${item.label}</span>
    </button>`;
  }).join("");
}
function renderWeather(){
  els.weatherRow.innerHTML = WEATHER.map(item=>{
    const on = state.weather===item.id;
    return `<button type="button" class="wx${on?" is-on":""}" role="option" aria-label="${item.label}" aria-selected="${on}" data-id="${item.id}" style="--tone:${item.color}">
      <span class="wx-icon" aria-hidden="true"><img class="wx-img" alt="" src="${WEATHER_ICONS[item.id]}" /></span>
      <span class="wx-label">${item.label}</span>
    </button>`;
  }).join("");
}
function currentPhoto(){
  if(!state.photos.length) return null;
  return state.photos.find(p=>p.id===state.viewingId) || state.photos.find(p=>p.id===state.coverId) || state.photos[0];
}
function renderPhotos(){
  const mount = els.photosMount;
  if(!state.photos.length){
    mount.innerHTML = `<div class="photo-empty">
      <label for="fileInput" class="photo-choice"><span class="plus">＋</span><span>从相册</span></label>
      <label for="cameraInput" class="photo-choice camera"><span class="plus"></span><span>拍照</span></label>
    </div>`;
    return;
  }
  if(!state.coverId) state.coverId = state.photos[0].id;
  const viewing = currentPhoto();
  state.viewingId = viewing.id;
  const atLimit = state.photos.length >= MAX_PHOTOS;
  const cards = state.photos.map((p,i)=>{
    const cover = p.id===state.coverId;
    return `<button type="button" class="pola${cover?" is-cover":""}" data-id="${p.id}">
      <img alt="" src="${p.dataUrl}" />
      <span class="cap"><span>${cover?"封面":"第"+(i+1)+"张"}</span><span>${i+1}/${state.photos.length}</span></span>
    </button>`;
  }).join("");
  mount.innerHTML = `<div class="pola-stage">${cards}</div>
    <div class="pola-actions">
      <button type="button" class="ghost" id="setCoverBtn"${viewing.id===state.coverId?" disabled":""}>设为封面</button>
      <button type="button" class="ghost danger" id="removeBtn">拿掉</button>
      <button type="button" class="ghost" id="addMoreBtn"${atLimit?" disabled":""}>添加照片</button>
      <span class="ghost" style="background:transparent">${state.photos.length}/${MAX_PHOTOS}</span>
    </div>`;
  mount.querySelectorAll(".pola").forEach(btn=>{
    btn.onclick=()=>{ state.viewingId=btn.dataset.id; renderPhotos(); };
  });
  mount.querySelector("#setCoverBtn").onclick=()=>{ state.coverId=viewing.id; renderPhotos(); };
  mount.querySelector("#removeBtn").onclick=()=>{
    state.photos=state.photos.filter(p=>p.id!==viewing.id);
    if(state.coverId===viewing.id) state.coverId=state.photos[0]?.id||null;
    state.viewingId=state.coverId; renderPhotos();
  };
  mount.querySelector("#addMoreBtn").onclick=()=>{ if(!atLimit) els.fileInput.click(); else toast("最多 9 张"); };
}
function toast(t){ els.toast.textContent=t; els.toast.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>els.toast.classList.remove("show"),3200); }
function updateNoteCount(){
  if (els.noteCount) els.noteCount.textContent = String(els.note.value.length) + "/" + String(els.note.maxLength || 4000);
}
function compactSeMode(){
  return !!(window.matchMedia && window.matchMedia("(max-width: 390px) and (max-height: 700px)").matches);
}
function resizeNote(){
  const compact = compactSeMode();
  const base = compact ? 58 : 86;
  const cap = compact ? 105 : 170;
  els.note.style.height = base + "px";
  const next = Math.min(cap, Math.max(base, els.note.scrollHeight));
  els.note.style.height = next + "px";
  els.note.style.overflowY = els.note.scrollHeight > cap ? "auto" : "hidden";
  updateNoteCount();
}
function isHeicLike(file){
  const t = (file.type || "").toLowerCase();
  const n = (file.name || "").toLowerCase();
  return t === "image/heic" || t === "image/heif" || /\.heic$/i.test(n) || /\.heif$/i.test(n);
}
function blobToDataUrl(blob){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => res(String(r.result || ""));
    r.onerror = () => rej(r.error || new Error("read"));
    r.readAsDataURL(blob);
  });
}
async function fileToJpegBlob(file){
  if (isHeicLike(file)) {
    if (typeof heic2any !== "function") throw new Error("heic2any missing");
    const out = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.92 });
    const blob = Array.isArray(out) ? out[0] : out;
    if (!blob) throw new Error("heic empty");
    return blob;
  }
  return file;
}
async function blobToResizedDataUrl(blob, maxEdge=1600, q=0.86){
  let bmp = null;
  try {
    if (window.createImageBitmap) {
      bmp = await createImageBitmap(blob);
    }
  } catch (_) {}
  if (bmp) {
    try {
      const w = bmp.width, h = bmp.height;
      if (!w || !h) throw new Error("empty");
      const scale = Math.min(1, maxEdge / Math.max(w, h));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(w * scale));
      canvas.height = Math.max(1, Math.round(h * scale));
      canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/jpeg", q);
    } finally {
      if (bmp.close) try { bmp.close(); } catch(_){}
    }
  }
  const url = URL.createObjectURL(blob);
  try {
    const img = await new Promise((resolve, reject) => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = () => reject(new Error("decode"));
      i.src = url;
    });
    const w = img.naturalWidth || img.width;
    const h = img.naturalHeight || img.height;
    if (!w || !h) throw new Error("empty");
    const scale = Math.min(1, maxEdge / Math.max(w, h));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(w * scale));
    canvas.height = Math.max(1, Math.round(h * scale));
    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL("image/jpeg", q);
  } finally {
    URL.revokeObjectURL(url);
  }
}
async function addFiles(list){
  const files = [...list].filter((f) => {
    const t = (f.type || "").toLowerCase();
    const n = (f.name || "").toLowerCase();
    return t.startsWith("image/") || /\.(jpe?g|png|gif|webp|heic|heif)$/i.test(n) || !t;
  });
  if (!files.length) {
    toast("没读到图片，换一张试试");
    return;
  }
  toast("正在处理照片…");
  let added = 0;
  let lastErr = null;
  for (const file of files) {
    if (state.photos.length >= MAX_PHOTOS) {
      toast("最多 9 张");
      break;
    }
    try {
      const jpegBlob = await fileToJpegBlob(file);
      const dataUrl = await blobToResizedDataUrl(jpegBlob);
      if (!dataUrl || !dataUrl.startsWith("data:image/")) throw new Error("bad");
      const id = "photo-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
      state.photos.push({
        id,
        name: "photo-" + (state.photos.length + 1) + ".jpg",
        mime: "image/jpeg",
        dataUrl,
      });
      if (!state.coverId) state.coverId = id;
      state.viewingId = id;
      added += 1;
    } catch (err) {
      lastErr = err;
      console.warn("photo fail", file.name, file.type, err);
    }
  }
  renderPhotos();
  if (added) toast("已添加 " + added + " 张");
  else if (lastErr) toast("这张加不上，请再试一次或换 JPG");
  else toast("没读到图片，换一张试试");
}
function syncDate(){
  const d=parseKey(state.dateKey);
  els.dow.textContent=WEEKDAYS[d.getDay()];
  els.dayNum.textContent=String(d.getDate());
  els.ym.textContent=d.getFullYear()+" · "+(d.getMonth()+1);
  els.dateInput.value=state.dateKey;
}
async function exportPayload(){
  state.note=els.note.value.trim();
  if(!state.weather&&!state.mood&&!state.note&&!state.photos.length){
    toast("先选个心情，或写一点点");
    return null;
  }
  const coverIndex=Math.max(0,state.photos.findIndex(p=>p.id===state.coverId));
  return {
    schema:"luma-lifelog-inbox-v1",
    dateKey:state.dateKey,
    weather:state.weather||"",
    mood:state.mood||"",
    note:state.note||"",
    coverIndex:state.photos.length?coverIndex:0,
    photos:state.photos.map((p,i)=>({name:p.name||("photo-"+(i+1)+".jpg"),mime:p.mime||"image/jpeg",dataBase64:p.dataUrl})),
    exportedAt:Date.now()
  };
}
async function save(){
  const payload = await exportPayload();
  if(!payload) return;
  const name = "lifelog-"+state.dateKey+".json";
  const text = JSON.stringify(payload, null, 2);
  const blob = new Blob([text], { type: "application/json" });
  const file = new File([blob], name, { type: "application/json" });
  const hasPhotos = !!(payload.photos && payload.photos.length);

  // iOS Safari: <a download> often does nothing — use system share → 存储到文件
  // Do NOT fall back to share({ text }) — that creates a useless「文本」file on iOS.
  try {
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Life Log "+state.dateKey });
      if (hasPhotos) {
        toast("文件可能较大；若 iCloud 已满，请存到「我的 iPhone」");
      } else {
        toast("选「存储到文件」→ iCloud → LumaInbox");
      }
      return;
    }
  } catch (err) {
    if (err && err.name === "AbortError") return;
    console.warn("share files failed", err);
  }

  // Desktop / fallback: real download + open blob tab
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => {
    const opened = window.open(url, "_blank");
    if (!opened) {
      toast("长按下方按钮，用分享保存");
      showManualSave(url, name);
    } else if (hasPhotos) {
      toast("文件可能较大；若 iCloud 已满，请存到「我的 iPhone」");
    } else {
      toast("若没弹出存储，用分享 → 存储到文件");
    }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }, 250);
}
function showManualSave(url, name){
  let bar = document.getElementById("manualSave");
  if (!bar) {
    bar = document.createElement("div");
    bar.id = "manualSave";
    bar.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:50;padding:12px;border-radius:14px;background:#2A2A2A;color:#F7F5F0;font-size:0.84rem;line-height:1.45;box-shadow:0 12px 28px rgba(0,0,0,.25)";
    document.body.appendChild(bar);
  }
  bar.innerHTML = "点右边打开文件，再用分享存到 iCloud <a id='manualSaveLink' href='"+url+"' download='"+name+"' style='float:right;color:#E8C547;font-weight:700;margin-left:8px'>打开</a>";
}
function refreshDateIfNeeded(){
  if(state.datePinned) return;
  const next=todayKey();
  if(state.dateKey!==next){
    state.dateKey=next;
    syncDate();
  }
}
function boot(){
  state.dateKey=todayKey();
  syncDate(); renderMood(); renderWeather(); renderPhotos(); applyAccent(); resizeNote();
  els.moodRail.addEventListener("click",e=>{
    const b=e.target.closest(".mood-stamp"); if(!b) return;
    state.mood=state.mood===b.dataset.id?"":b.dataset.id;
    renderMood(); applyAccent();
  });
  els.weatherRow.addEventListener("click",e=>{
    const b=e.target.closest(".wx"); if(!b) return;
    state.weather=state.weather===b.dataset.id?"":b.dataset.id;
    renderWeather(); applyAccent();
  });
  els.dateInput.addEventListener("change",()=>{
    const v=els.dateInput.value||todayKey();
    state.dateKey=v;
    state.datePinned = v !== todayKey();
    syncDate();
  });
  els.note.addEventListener("input",()=>{ state.note=els.note.value; resizeNote(); });
  els.fileInput.addEventListener("change",async()=>{const files=Array.from(els.fileInput.files||[]); els.fileInput.value=""; if(files.length) await addFiles(files); else toast("没有选到文件");});
  els.cameraInput.addEventListener("change",async()=>{const files=Array.from(els.cameraInput.files||[]); els.cameraInput.value=""; if(files.length) await addFiles(files); else toast("没有选到文件");});
  els.saveBtn.addEventListener("click",()=>{ refreshDateIfNeeded(); save(); });
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") refreshDateIfNeeded(); });
  window.addEventListener("pageshow", refreshDateIfNeeded);
  window.addEventListener("focus", refreshDateIfNeeded);
  window.addEventListener("resize", resizeNote);
}
boot();
</script>
</body>
</html>
